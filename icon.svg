    <g fill="#c8f03a">
      <path d="M30 40 h18 l-14 60 h-18z"/><path d="M64 40 h18 l-14 60 h-18z"/><path d="M98 40 h18 l-14 60 h-18z"/><path d="M132 40 h18 l-14 60 h-18z"/>
    </g>
  </g>
  <path d="M30 70 L146 42 L151 62 L35 90 Z" fill="none" stroke="#c8f03a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- slate -->
