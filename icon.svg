<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Home-screen icon source for apple-touch-icon.png (rendered with Archivo loaded). Full bleed: iOS rounds the corners. -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="100%">
      <stop offset="0" stop-color="#1d1d22"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <clipPath id="arm"><path d="M30 70 L146 42 L151 62 L35 90 Z"/></clipPath>
  </defs>
  <rect width="180" height="180" fill="url(#bg)"/>
