  <circle cx="47" cy="121" r="7.5" fill="#e5332a"/>
  <text x="62" y="131" font-family="Archivo, sans-serif" font-weight="900" font-size="27" font-stretch="125%" letter-spacing="-.5" fill="#0b0b0d">CUT</text>
